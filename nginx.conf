server {
    server_tokens off;

    listen 80;
    root /var/www/html/;
}

# Reject requests which don't match configured domains
server {
    server_tokens off;

    listen 10080 default_server;
    listen 10443 ssl default_server;
    server_name _;  # Catch all requests with a domain not configured

    ssl_certificate /certs/localhost/fullchain.pem;
    ssl_certificate_key /certs/localhost/key.pem;

    return 444;
}
